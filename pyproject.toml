[project]
name = "agent-intent-protocol"
version = "0.4.0"
description = "Pay-per-request access for AI agents over the open x402 protocol: 21 intent types that resolve a task to a provider, plus a searchable marketplace of 2,700+ priced API endpoints. Settles on Base or Solana with a single signature, and every receipt verifies offline."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "JarvisClaw", email = "dev@jarvisclaw.ai"}
]
keywords = ["x402", "ai", "agent", "intent", "payments", "usdc", "eip-3009", "llm", "http-402", "api-marketplace", "aip", "base", "solana", "pay-per-call", "agent-payments"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "httpx>=0.24.0",
    "eth-account>=0.11.0",
]

[project.optional-dependencies]
solana = ["pynacl>=1.5.0"]
dev = ["pytest>=7.0", "pytest-httpx>=0.21.0", "pytest-asyncio>=0.23.0", "ruff>=0.1.0,<0.13", "pynacl>=1.5.0"]

[project.urls]
Homepage = "https://github.com/api-jarvisclaw/agent-intent-protocol"
Documentation = "https://github.com/api-jarvisclaw/agent-intent-protocol#readme"
Repository = "https://github.com/api-jarvisclaw/agent-intent-protocol"
Issues = "https://github.com/api-jarvisclaw/agent-intent-protocol/issues"
Protocol = "https://github.com/api-jarvisclaw/agent-intent-protocol"
x402 = "https://x402.org"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_intent_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
